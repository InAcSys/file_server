services:

    file-server:
        image: file-server:latest
        restart: always
        build: .
        environment:
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_DATABASE: ${DB_DATABASE}
            DB_PORT: ${DB_PORT}
            DB_HOST: file-server-db
        ports:
            - "${FILE_SERVER_PORT}:8000"
        depends_on:
            - file-server-db
        volumes:
            - .:/app
        networks:
            - file-server-net
            - backend-net

    file-server-db:
        image: mysql:8.0
        ports:
            - "3311:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        networks:
            - file-server-net

volumes:
    mysql-data:


networks:
    file-server-net:
    backend-net:
        external: true
